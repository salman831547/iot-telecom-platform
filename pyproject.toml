[project]
name = "iot-pipeline"
version = "0.1.0"
description = "IoT telecom data platform: config-driven ETL on Cloud Composer, GCS and BigQuery"
readme = "README.md"
# Matches the Python runtime of Cloud Composer 3 images.
requires-python = ">=3.11,<3.13"
# Runtime deps are ALL pre-installed in Composer images -> no PyPI access needed in prod.
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "google-cloud-storage>=2.16,<4",
  "google-cloud-bigquery>=3.20,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
]

[project.scripts]
iot-config = "iot_pipeline.config:_cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_pipeline"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "dags", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit (security)
  "SIM", "C4", "RET", "PTH", "N",
  "AIR",           # Airflow-specific rules
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers --cov=iot_pipeline --cov-report=term-missing"
markers = [
  "integration: tests that need GCP credentials (skipped in PR CI)",
]

# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["iot_pipeline"]

# =============================================================================
# Single source of truth for the `dev` environment.
#
# Consumed by:
#   - Terraform      -> yamldecode(file("config/envs/<env>.yaml"))
#   - Airflow DAGs   -> iot_pipeline.config.load_config()   (deployed to Composer bucket)
#   - Data generator -> iot_pipeline.config.load_config()
#
# Rules:
#   - NO secrets here. Secrets live in Secret Manager; only their IDs are referenced.
#   - Resource names are explicit (not derived) so Terraform and Python can never drift.
#   - Every key is validated by the pydantic schema in src/iot_pipeline/config.py
#     (unknown keys fail CI -> typos are caught before deploy).
# =============================================================================
env: dev

project:
  id: project-2026-ai
  region: us-central1

labels:
  app: iot-telecom
  env: dev
  owner: data-platform
  cost-center: rnd
  managed-by: terraform

github:
  owner: salman831547
  # Immutable numeric owner id (https://api.github.com/users/<owner>). WIF trusts this id,
  # not just the name, so a deleted-and-recreated account/repo name cannot be hijacked.
  owner_id: "48931885"
  repo: iot-telecom-platform
  deploy_branch: main
  environment: dev # GitHub Environment that gates `terraform apply`

terraform:
  state_bucket: project-2026-ai-iot-tfstate
  state_prefixes:
    bootstrap: bootstrap
    foundation: foundation/dev
    composer: composer/dev

# APIs enabled by the 00-bootstrap layer (nothing is enabled by hand).
apis:
  - artifactregistry.googleapis.com
  - bigquery.googleapis.com
  - cloudbuild.googleapis.com
  - cloudresourcemanager.googleapis.com
  - composer.googleapis.com
  - compute.googleapis.com
  - iam.googleapis.com
  - iamcredentials.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com
  - secretmanager.googleapis.com
  - serviceusage.googleapis.com
  - storage.googleapis.com
  - sts.googleapis.com

service_accounts:
  tf_plan: sa-iot-dev-tf-plan # GitHub Actions, PRs (read-only)
  tf_apply: sa-iot-dev-tf-apply # GitHub Actions, main branch + approval
  cloudbuild_deployer: sa-iot-dev-cb-deployer # Cloud Build, DAG sync only
  composer_runtime: sa-iot-dev-composer # Airflow workers / scheduler

workload_identity:
  pool_id: github-pool
  provider_id: github-oidc

# Least-privilege role sets, applied by 00-bootstrap. Changing access = a reviewed PR.
iam:
  tf_plan_project_roles: # read-only: PR plans (run with -lock=false)
    - roles/viewer
    - roles/iam.securityReviewer
  tf_apply_project_roles: # create/modify foundation + composer layers
    - roles/viewer
    - roles/storage.admin
    - roles/bigquery.admin
    - roles/composer.admin
    - roles/compute.networkAdmin
    - roles/secretmanager.admin
    - roles/iam.serviceAccountAdmin
    - roles/cloudbuild.builds.editor
    - roles/logging.viewer
    - roles/serviceusage.serviceUsageConsumer
  # tf_apply gets projectIamAdmin ONLY for these roles (IAM condition), so it can never
  # grant itself or anyone else Owner/Editor.
  tf_apply_grantable_roles:
    - roles/composer.worker
    - roles/composer.ServiceAgentV2Ext
    - roles/bigquery.jobUser
    - roles/logging.logWriter
    - roles/monitoring.metricWriter
  cloudbuild_deployer_project_roles:
    - roles/logging.logWriter

network:
  vpc_name: iot-dev-vpc
  subnet_name: iot-dev-composer-subnet
  subnet_cidr: 10.10.0.0/24

storage:
  location: US-CENTRAL1
  staging_bucket:
    name: project-2026-ai-iot-dev-staging
    versioning: false
    nearline_after_days: 30
    delete_after_days: 90
  composer_bucket:
    name: project-2026-ai-iot-dev-composer
    versioning: true
    noncurrent_versions_to_keep: 5
  cloudbuild_bucket: # source tarballs for `gcloud builds submit` (short-lived)
    name: project-2026-ai-iot-dev-cloudbuild
    delete_after_days: 7

bigquery:
  location: us-central1
  datasets:
    landing:
      id: iot_landing # transient all-STRING load tables
      default_table_expiration_hours: 24
    silver:
      id: iot_silver
      default_partition_expiration_days: 365
    gold:
      id: iot_gold
      default_partition_expiration_days: 730
    ops:
      id: iot_ops # watermarks, audit log (pipeline state survives Composer)
      default_partition_expiration_days: 365

secrets:
  pii_hash_salt: iot-dev-pii-hash-salt # Secret Manager secret ID (value never in git)

composer:
  environment_name: iot-dev-composer
  image_version: composer-3-airflow-3.3.1-build.5 # latest Composer 3 image in us-central1 (2026-10-27)
  environment_size: ENVIRONMENT_SIZE_SMALL
  private_environment: true # no public IPs, no internet egress (library is stdlib + preinstalled pkgs)
  # Attach workloads to our VPC (network.*). Off: nothing in the VPC needs reaching yet, and it adds
  # Composer service-agent network permissions. Composer 3 is private either way.
  attach_vpc: false
  resilience_mode: STANDARD_RESILIENCE
  workloads:
    scheduler: { cpu: 0.5, memory_gb: 2, storage_gb: 1, count: 1 }
    web_server: { cpu: 0.5, memory_gb: 2, storage_gb: 1 }
    triggerer: { cpu: 0.5, memory_gb: 2, count: 1 } # Composer 3 + Airflow 3 minimum is 2 GB
    worker: { cpu: 0.5, memory_gb: 2, storage_gb: 1, min_count: 1, max_count: 3 }
  airflow_config_overrides:
    core-dags_are_paused_at_creation: "True"
    core-max_active_runs_per_dag: "1"
    dag_processor-refresh_interval: "60" # Airflow 3 name of scheduler.dag_dir_list_interval
  env_variables:
    IOT_ENV: dev
  # Ephemeral operation (scripts/composer_lifecycle.py cycle): create -> deploy -> run -> destroy.
  lifecycle:
    max_catchup_hours: 6 # hours of missed ingestion to process per cycle (bounds cost/time)
    run_timeout_minutes: 60 # give up waiting for the DAG chain after this
    poll_seconds: 30
    quiet_polls: 2 # consecutive polls with no active DAG runs before the chain counts as finished
    destroy_on_failure: true # never leave a paid environment running after a failed cycle

pipeline:
  owner: data-platform
  timezone: UTC
  start_date: "2026-11-09T00:00:00+00:00"
  # null = on-demand: scripts/composer_lifecycle.py triggers every DAG 1 run (ephemeral
  # Composer). Set "@hourly" for an always-on environment where Airflow schedules itself.
  schedule: null
  catchup: false
  max_active_runs: # per DAG
    ingest: 4 # hours are independent (own file each) -> run catch-up hours in parallel
    silver: 1 # serialised: concurrent MERGEs would race on the watermark
    gold: 1 # serialised: concurrent rebuilds of the same partition would conflict
  tags: [iot, telecom]
  default_task:
    retries: 1
    retry_delay_seconds: 10
    retry_exponential_backoff: true
    max_retry_delay_seconds: 60
    execution_timeout_minutes: 10
  dagrun_timeout_minutes: 10
  dags:
    ingest: iot_01_ingest_raw
    silver: iot_02_raw_to_silver
    gold: iot_03_silver_to_gold
  raw:
    prefix: raw/iot_telemetry # gs://<staging>/raw/iot_telemetry/dt=YYYY-MM-DD/hour=HH/
    manifest_prefix: manifests/iot_telemetry
    file_format: csv
  tables:
    landing_raw: raw_telemetry
    silver_telemetry: telemetry
    gold_device_hourly: device_hourly_kpis
    gold_cell_hourly: cell_hourly_kpis
    ops_watermarks: watermarks
    ops_audit: batch_audit
  silver:
    watermark_key: raw_to_silver # row key in iot_ops.watermarks
    max_files_per_run: 48 # bounds catch-up work after downtime (e.g. Composer rebuild)
  data_quality:
    min_rows_per_batch: 100
    max_invalid_ratio: 0.20
    # Rows outside these ranges are kept in silver with is_valid=false and a dq_flag.
    valid_ranges:
      rsrp_dbm: [-140, -44]
      rsrq_db: [-20, -3]
      sinr_db: [-20, 30]
      battery_pct: [0, 100]
      temperature_c: [-40, 85]
    # Operator footprint (US, MCC 310). Catches swapped lat/long that are still "valid" numbers.
    service_area: { lat_min: 18.0, lat_max: 72.0, lon_min: -170.0, lon_max: -60.0 }
    poor_coverage_rsrp_dbm: -110 # gold: share of events below this = poor_coverage_ratio

generator:
  seed_strategy: logical_date # deterministic per interval -> idempotent re-runs
  rows_per_batch: { min: 500, max: 2000 }
  device_count: 300
  anomalies:
    duplicate_ratio: 0.03
    null_ratio: 0.02
    out_of_range_ratio: 0.02
    unit_suffix_ratio: 0.30
    epoch_timestamp_ratio: 0.25
  network:
    mcc: "310"
    mnc: ["260", "410"]
